name: Refresh and publish Intelligence Hub

on:
  push:
    branches: [main]
  schedule:
    # Every two hours. GitHub starts scheduled runs late or drops them; the site
    # reports the observed gap from data/v7/index.json, never this request.
    - cron: '7 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intelligence-hub-pages
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'TeamStarWolf/intelligence-hub' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.result.outputs.changed }}
    steps:
      - name: Read repository source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select daily public-data cache
        id: day
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Retain bounded public-feed history
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .state/public-cache.json
            .state/cve-projections.json
          key: public-v2-${{ hashFiles('intelligence_hub/*.py', 'config/sources.json') }}-${{ steps.day.outputs.value }}
          restore-keys: |
            public-v2-${{ hashFiles('intelligence_hub/*.py', 'config/sources.json') }}-
      - name: Collect actual public intelligence
        env:
          CVE_ENRICH_LIMIT: ${{ github.event_name == 'push' && '2000' || '40' }}
        run: |
          python3 --version
          python3 -m intelligence_hub --resume-public --enrich-limit "$CVE_ENRICH_LIMIT"
      - name: Read typed publication decision
        id: result
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path
          path = Path('.state/collection-result.json')
          with path.open('rb') as source:
              raw = source.read(65537)
          if len(raw) > 65536:
              raise SystemExit('The collection result exceeds its bound.')
          result = json.loads(raw)
          if not isinstance(result, dict) or type(result.get('changed')) is not bool:
              raise SystemExit('The collection result requires a Boolean changed field.')
          shard = re.compile(r'(?:sources|coverage|reports|cve-index)\.json|live/(?:[0-9]{4}-(?:0[1-9]|1[0-2])|undated)\.json'
                             r'|history/(?:[0-9]{4}|undated)\.json|kev/[0-9]{4}\.json|cve/[0-9]{4}/[0-9]{1,5}k\.json')
          for field in ('changed_shards', 'removed_shards'):
              paths = result.get(field)
              if (type(paths) is not list or len(paths) > 1000 or
                      not all(type(path) is str and shard.fullmatch(path) for path in paths)):
                  raise SystemExit('The collection result requires a typed ' + field + ' list.')
          print('Changed shards: ' + str(len(result['changed_shards'])) + '; removed shards: ' + str(len(result['removed_shards'])))
          value = 'true' if result['changed'] else 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('changed=' + value + '\n')
          print('Publication required: ' + value)
      - name: Package only the files the v7 manifest lists
        if: steps.result.outputs.changed == 'true'
        # Checks every file against data/v7/index.json (allowlisted patterns, the exact
        # set of shards and exports, sha256 and bytes, no links), then the caps: 4,000
        # files, 4 MiB per v7 shard or export file, 192 MiB input and a 48,000,000-byte
        # compressed estimate, each printed with its headroom. The checks and the cap
        # numbers live in intelligence_hub/shards.py with tests.
        run: python3 -m intelligence_hub.shards package site
      - name: Upload public site
        if: steps.result.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
          retention-days: 1

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Intelligence Hub
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
