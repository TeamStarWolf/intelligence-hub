name: Refresh and publish Intelligence Hub

on:
  push:
    branches: [main]
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intelligence-hub-pages
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'TeamStarWolf/intelligence-hub' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.result.outputs.changed }}
    steps:
      - name: Read repository source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select daily public-data cache
        id: day
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Retain bounded public-feed history
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .state/public-cache.json
            .state/cve-projections.json
          key: public-v2-${{ hashFiles('intelligence_hub/*.py', 'config/sources.json') }}-${{ steps.day.outputs.value }}
          restore-keys: |
            public-v2-${{ hashFiles('intelligence_hub/*.py', 'config/sources.json') }}-
      - name: Collect actual public intelligence
        env:
          CVE_ENRICH_LIMIT: ${{ github.event_name == 'push' && '2000' || '40' }}
        run: |
          python3 --version
          python3 -m intelligence_hub --resume-public --enrich-limit "$CVE_ENRICH_LIMIT"
      - name: Read typed publication decision
        id: result
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          path = Path('.state/collection-result.json')
          with path.open('rb') as source:
              raw = source.read(65537)
          if len(raw) > 65536:
              raise SystemExit('The collection result exceeds its bound.')
          result = json.loads(raw)
          if not isinstance(result, dict) or type(result.get('changed')) is not bool:
              raise SystemExit('The collection result requires a Boolean changed field.')
          value = 'true' if result['changed'] else 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('changed=' + value + '\n')
          print('Publication required: ' + value)
      - name: Package only public site files
        if: steps.result.outputs.changed == 'true'
        shell: python
        run: |
          import gzip
          import io
          import stat
          import tarfile
          import zlib
          from pathlib import Path
          expected = {'index.html', 'styles.css', 'app.js', 'icon.svg', 'data/feed.json'}
          root = Path('site')
          if not stat.S_ISDIR(root.lstat().st_mode) or root.is_symlink():
              raise SystemExit('The public site must be an ordinary directory.')
          found = set()
          for path in root.rglob('*'):
              info = path.lstat()
              if stat.S_ISLNK(info.st_mode):
                  raise SystemExit('Links are not permitted in the site artifact.')
              name = path.relative_to(root).as_posix()
              if stat.S_ISDIR(info.st_mode):
                  if name != 'data':
                      raise SystemExit('The public artifact contains an unexpected directory.')
              elif stat.S_ISREG(info.st_mode) and info.st_nlink == 1:
                  found.add(name)
              else:
                  raise SystemExit('Only ordinary single-link files may enter the public artifact.')
          if found != expected:
              raise SystemExit('The public artifact file list differs from its allowlist.')
          maximum_input = 21 * 1024 * 1024
          total = 0
          archive = io.BytesIO()
          with tarfile.open(fileobj=archive, mode='w', format=tarfile.USTAR_FORMAT) as tar:
              for directory in ('.', './data'):
                  info = tarfile.TarInfo(directory)
                  info.type = tarfile.DIRTYPE
                  info.mode = 0o755
                  tar.addfile(info)
              for name in sorted(expected):
                  path = root / name
                  if path.stat().st_size > maximum_input - total:
                      raise SystemExit('The public site exceeds its package limit.')
                  with path.open('rb') as source:
                      content = source.read(maximum_input - total + 1)
                  total += len(content)
                  if total > maximum_input:
                      raise SystemExit('The public site exceeds its package limit.')
                  info = tarfile.TarInfo('./' + name)
                  info.mode = 0o644
                  info.size = len(content)
                  tar.addfile(info, io.BytesIO(content))
          # Estimate the pinned upload action's default level-6 compression.
          # Its actual tar/ZIP metadata and account-wide storage remain separate.
          tar_bytes = archive.getvalue()
          estimate = max(len(gzip.compress(tar_bytes, compresslevel=6, mtime=0)),
                         len(zlib.compress(tar_bytes, level=6)))
          if estimate > 3000000:
              raise SystemExit('The estimated compressed artifact exceeds the 3000000-byte budget; publication is blocked.')
          print('Public input bytes: ' + str(total))
          print('Estimated compressed artifact bytes: ' + str(estimate))
      - name: Upload public site
        if: steps.result.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
          retention-days: 1

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Intelligence Hub
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
