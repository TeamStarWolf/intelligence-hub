name: Check pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - name: Read repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -I -m unittest discover -s tests -v
      - name: Fixture is current
        run: python -I tests/fixtures/build_fixture.py --check
      - name: History check (offline)
        # Schema, sort order, unique ids, URL safety, in-year dates, caps, coverage agreement
        # and every fixture re-parsed to its golden file. -E -s for the same reason as below.
        run: python -E -s -m intelligence_hub.history check
      - name: Offline build on the committed fixture
        # -I would drop the checkout from sys.path, so -E -s keep the rest of isolated mode.
        run: |
          mkdir -p .state
          cp tests/fixtures/public-cache.json .state/public-cache.json
          # The trimmed MSRC, Adobe and SAP documents the Patch Tuesday step reads offline.
          cp -R tests/fixtures/patch-tuesday/documents .state/patch-tuesday-documents
          python -E -s -m intelligence_hub --cached --start 1998-01-01 --end 2026-11-01
      - name: Validate the offline snapshot
        shell: python
        run: |
          import json
          import sys
          sys.path.insert(0, '.')
          from intelligence_hub.archive import validate_snapshot
          with open('site/data/feed.json', encoding='utf-8') as stream:
              feed = json.load(stream)
          validate_snapshot(feed)
          with open('.state/collection-result.json', encoding='utf-8') as stream:
              result = json.load(stream)
          print('Articles: ' + str(len(feed['articles'])) + '; reports: ' + result['reports']['status'])
      - name: Page files, stamping and the labels module
        # site/files.json is the page-file allowlist; the stamp runs on a temporary copy.
        run: |
          python -E -s -m intelligence_hub.site check site
          python -E -s -m intelligence_hub.site labels --check
      - name: Site script syntax
        shell: bash
        run: |
          node --version
          for name in $(python -I -c "import json; [print(name) for name in json.load(open('site/files.json'))['files'] if name.endswith('.js')]"); do
            node --check "site/$name"
          done
      - name: Site tests (node --test, no npm)
        # Router, URL state, the poll, the deploy-skew guard and the Explorer-first DOM order on
        # site/index.html; the last test reads the offline build above.
        run: node --test tests/js/*.test.js
      - name: Contrast of every text pair in both themes
        run: python -I tests/check_contrast.py
      - name: 12 px type floor
        run: python -I tests/check_font_size.py
      - name: Em-dash lint outside reports/
        run: python -I tests/check_em_dash.py
