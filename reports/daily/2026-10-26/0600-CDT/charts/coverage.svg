<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="427" viewBox="0 0 1000 427" role="img" aria-labelledby="title desc">
<title id="title">Retained row coverage</title>
<desc id="desc">3,817 saved rows; six mutually exclusive date cohorts. Date-only selection uses a UTC-calendar convention with unknown publisher timezone. Undated/outside rows are retained-input denominators, not period activity. Later generation does not establish complete coverage.</desc>
